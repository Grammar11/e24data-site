<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e24Market - Your Market, Anytime, Anywhere 24/7</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; background: white; color: #111; }
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
    .space-grotesk { font-family: 'Space Grotesk', sans-serif; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .slide-up { animation: slideUp 0.25s ease; }
    button { font-family: inherit; cursor: pointer; border: none; }
    input, select, textarea { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // COLORS
    const YELLOW = "#F6C500";
    const YELLOW_SOFT = "#FFF4C2";
    const BLACK = "#111111";
    const GRAY_SOFT = "#EDEDED";
    const WHITE = "#FFFFFF";
    const BANK = { number: "8147972378", name: "Opay", holder: "Nura Sulaiman" };
    const BIZ_PHONE = "08147972378";
    const ADMIN_PASSWORD = "@Nura2652";

    // DATABASE (localStorage)
    const DB = {
      getProducts: () => JSON.parse(localStorage.getItem("e24_products") || "[]"),
      setProducts: (p) => localStorage.setItem("e24_products", JSON.stringify(p)),
      getOrders: () => JSON.parse(localStorage.getItem("e24_orders") || "[]"),
      setOrders: (o) => localStorage.setItem("e24_orders", JSON.stringify(o)),
    };

    const DEFAULT_PRODUCTS = [
      { id: 1, name: "Rice (Bag - 50kg)", price: 65000, cat: "Food" },
      { id: 2, name: "Tomatoes (Fresh)", price: 3500, cat: "Food" },
      { id: 3, name: "Cooking Oil (5L)", price: 12000, cat: "Food" },
      { id: 4, name: "T-Shirt & Trousers", price: 15500, cat: "Clothes" },
      { id: 5, name: "Wrapper (2 Yards)", price: 8000, cat: "Clothes" },
      { id: 6, name: "Android Smartphone", price: 145000, cat: "Electronics" },
      { id: 7, name: "Kitchen Cookware Set", price: 22000, cat: "Kitchenware" },
      { id: 8, name: "Fresh Tomatoes (Basket)", price: 9000, cat: "Food" },
      { id: 9, name: "Phone Charger", price: 4500, cat: "Electronics" },
    ];

    const CATEGORIES = ["All", "Food", "Clothes", "Electronics", "Kitchenware"];

    function naira(n) {
      return "₦" + n.toLocaleString("en-NG");
    }

    // MAIN APP
    function E24Market() {
      const [page, setPage] = useState("home");
      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [adminPassword, setAdminPassword] = useState("");

      useEffect(() => {
        const stored = DB.getProducts();
        if (stored.length === 0) {
          DB.setProducts(DEFAULT_PRODUCTS);
          setProducts(DEFAULT_PRODUCTS);
        } else {
          setProducts(stored);
        }
        setOrders(DB.getOrders());
      }, []);

      const handleAdminLogin = () => {
        if (adminPassword === ADMIN_PASSWORD) {
          setPage("admin");
          setAdminPassword("");
        } else {
          alert("Wrong password!");
          setAdminPassword("");
        }
      };

      return (
        <div style={{ background: WHITE, minHeight: "100vh", color: BLACK }}>
          {page === "home" && <HomePage onCustomer={() => setPage("customer")} onAdmin={() => setPage("admin")} adminPassword={adminPassword} setAdminPassword={setAdminPassword} onAdminLogin={handleAdminLogin} />}
          {page === "customer" && <CustomerShop products={products} orders={orders} setOrders={setOrders} onBack={() => setPage("home")} />}
          {page === "admin" && <AdminDashboard products={products} setProducts={setProducts} orders={orders} setOrders={setOrders} onLogout={() => setPage("home")} />}
        </div>
      );
    }

    // HOME PAGE
    function HomePage({ onCustomer, onAdmin, adminPassword, setAdminPassword, onAdminLogin }) {
      const [showAdminForm, setShowAdminForm] = useState(false);
      const [showPassword, setShowPassword] = useState(false);

      return (
        <div style={{ minHeight: "100vh", background: BLACK, color: WHITE, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "20px" }}>
          <div style={{ textAlign: "center", marginBottom: 48 }}>
            <div style={{ width: 80, height: 104, background: `conic-gradient(${YELLOW} 0deg 180deg, ${BLACK} 180deg 360deg)`, borderRadius: "50% 50% 50% 0", display: "flex", alignItems: "flex-start", justifyContent: "center", paddingTop: 10, fontWeight: 700, fontSize: 28, color: BLACK, margin: "0 auto 20px" }}>24</div>
            <h1 className="space-grotesk" style={{ fontSize: 42, margin: "0 0 12px", fontWeight: 700, letterSpacing: "-0.02em" }}>
              <span style={{ color: YELLOW }}>e24</span>Market
            </h1>
            <p style={{ fontSize: 18, opacity: 0.8, margin: 0, maxWidth: 400 }}>Your market, anytime, anywhere 24/7</p>
          </div>

          <div style={{ maxWidth: 400, width: "100%", display: "flex", flexDirection: "column", gap: 16 }}>
            <button onClick={onCustomer} style={{
              background: YELLOW, color: BLACK, border: "none", borderRadius: 16, padding: "20px",
              fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 18, display: "flex",
              alignItems: "center", justifyContent: "center", gap: 12, cursor: "pointer",
              boxShadow: "0 4px 16px rgba(0,0,0,0.3)", transition: "all .2s"
            }} onMouseOver={(e) => e.target.style.transform = "translateY(-2px)"} onMouseOut={(e) => e.target.style.transform = "translateY(0)"}>
              🛒 Shop as Customer
            </button>

            <button onClick={() => setShowAdminForm(!showAdminForm)} style={{
              background: WHITE, color: BLACK, border: `2px solid ${YELLOW}`, borderRadius: 16, padding: "20px",
              fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 18, display: "flex",
              alignItems: "center", justifyContent: "center", gap: 12, cursor: "pointer",
              transition: "all .2s"
            }} onMouseOver={(e) => e.target.style.background = GRAY_SOFT} onMouseOut={(e) => e.target.style.background = WHITE}>
              ⚙️ Admin Login
            </button>
          </div>

          {showAdminForm && (
            <div style={{
              marginTop: 32, background: WHITE, color: BLACK, borderRadius: 16, padding: 24,
              width: "100%", maxWidth: 320, border: `2px solid ${YELLOW}`, animation: "slideUp 0.3s ease"
            }}>
              <h3 style={{ margin: "0 0 16px", fontFamily: "'Space Grotesk'", fontSize: 18, fontWeight: 700 }}>Admin Login</h3>
              <div style={{ marginBottom: 16 }}>
                <label style={{ fontSize: 12, fontWeight: 600, display: "block", marginBottom: 6, opacity: 0.75 }}>Password</label>
                <div style={{ display: "flex", alignItems: "center", gap: 8, background: "#f5f5f5", border: `1.5px solid ${BLACK}`, borderRadius: 10, padding: "10px 12px" }}>
                  <input type={showPassword ? "text" : "password"} placeholder="Enter password" value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && onAdminLogin()} style={{ border: "none", outline: "none", background: "transparent", fontSize: 14, flex: 1 }} />
                  <button onClick={() => setShowPassword(!showPassword)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16 }}>{showPassword ? "👁️" : "🔒"}</button>
                </div>
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => setShowAdminForm(false)} style={{ flex: 1, background: GRAY_SOFT, color: BLACK, border: "none", borderRadius: 10, padding: "11px 0", fontWeight: 600, fontSize: 13 }}>Cancel</button>
                <button onClick={onAdminLogin} style={{ flex: 1, background: YELLOW, color: BLACK, border: "none", borderRadius: 10, padding: "11px 0", fontWeight: 700, fontSize: 13 }}>Login</button>
              </div>
            </div>
          )}

          <div style={{ marginTop: 48, textAlign: "center", opacity: 0.6, fontSize: 13 }}>
            <p>Questions? WhatsApp: <b>{BIZ_PHONE}</b></p>
          </div>
        </div>
      );
    }

    // CUSTOMER SHOP
    function CustomerShop({ products, orders, setOrders, onBack }) {
      const [activeCat, setActiveCat] = useState("All");
      const [cart, setCart] = useState({});
      const [cartOpen, setCartOpen] = useState(false);
      const [stage, setStage] = useState("shop");
      const [form, setForm] = useState({ name: "", phone: "", address: "" });
      const [copied, setCopied] = useState(false);
      const [orderId] = useState(() => "E24-" + Math.floor(10000 + Math.random() * 89999));

      const filtered = useMemo(() => (activeCat === "All" ? products : products.filter(p => p.cat === activeCat)), [activeCat, products]);
      const cartItems = useMemo(() => Object.entries(cart).filter(([, qty]) => qty > 0).map(([id, qty]) => ({ ...products.find(p => p.id === Number(id)), qty })), [cart, products]);
      const total = cartItems.reduce((sum, i) => sum + i.price * i.qty, 0);
      const itemCount = cartItems.reduce((sum, i) => sum + i.qty, 0);
      const DELIVERY_FEE = itemCount > 0 ? 1500 : 0;

      const addToCart = (id) => setCart(c => ({ ...c, [id]: (c[id] || 0) + 1 }));
      const dec = (id) => setCart(c => ({ ...c, [id]: Math.max(0, (c[id] || 0) - 1) }));
      const canCheckout = form.name.trim() && form.phone.trim() && form.address.trim();

      const copyAccount = () => {
        navigator.clipboard.writeText(BANK.number);
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      };

      const confirmOrder = () => {
        const newOrder = { id: orderId, customer: form, items: cartItems, total: total + DELIVERY_FEE, status: "Payment Pending", date: new Date().toLocaleString() };
        setOrders([...orders, newOrder]);
        DB.setOrders([...orders, newOrder]);
        setStage("confirmed");
      };

      return (
        <div style={{ background: WHITE, minHeight: "100vh", color: BLACK }}>
          <header style={{ position: "sticky", top: 0, zIndex: 20, background: WHITE, borderBottom: `2px solid ${BLACK}`, padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <button onClick={onBack} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer" }}>←</button>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ width: 32, height: 42, background: `conic-gradient(${YELLOW} 0deg 180deg, ${BLACK} 180deg 360deg)`, borderRadius: "50% 50% 50% 0", display: "flex", alignItems: "flex-start", justifyContent: "center", paddingTop: 4, fontWeight: 700, fontSize: 11, color: BLACK }}>24</div>
              <div className="space-grotesk" style={{ fontWeight: 700, fontSize: 19 }}><span style={{ color: YELLOW }}>e24</span>Market</div>
            </div>
            {stage === "shop" && <button onClick={() => setCartOpen(true)} style={{ background: BLACK, color: WHITE, border: "none", borderRadius: 999, padding: "10px 16px", display: "flex", alignItems: "center", gap: 6, fontWeight: 600, fontSize: 14 }}>🛒 Cart {itemCount > 0 && <span style={{ background: YELLOW, color: BLACK, borderRadius: 999, fontSize: 10, minWidth: 16, height: 16, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700 }}>{itemCount}</span>}</button>}
          </header>

          {stage === "shop" && (
            <>
              <section style={{ padding: "32px 20px 28px", background: BLACK, color: WHITE, textAlign: "center" }}>
                <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: YELLOW, borderRadius: 999, padding: "5px 12px", fontSize: 12, fontWeight: 700, color: BLACK, marginBottom: 12 }}>⏰ LAUNCHED TODAY — 24/7 Shopping!</div>
                <h1 className="space-grotesk" style={{ fontSize: 26, lineHeight: 1.2, fontWeight: 700, margin: "0 auto 8px", maxWidth: 420 }}>Shop from home, delivered to you.</h1>
                <p style={{ fontSize: 14, opacity: 0.85, margin: "0 auto", maxWidth: 380 }}>Browse, pay safely, get delivery—all without leaving your home.</p>
              </section>

              <div style={{ display: "flex", gap: 8, padding: "12px 20px", overflowX: "auto", background: WHITE }}>
                {CATEGORIES.map(cat => (
                  <button key={cat} onClick={() => setActiveCat(cat)} style={{ border: `1.5px solid ${BLACK}`, background: activeCat === cat ? YELLOW : WHITE, color: BLACK, borderRadius: 999, padding: "7px 14px", fontSize: 13, fontWeight: 600, whiteSpace: "nowrap", flexShrink: 0 }}>{cat}</button>
                ))}
              </div>

              <section style={{ padding: "16px 20px 40px", display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 12, maxWidth: 900, margin: "0 auto" }}>
                {filtered.map(p => {
                  const qty = cart[p.id] || 0;
                  return (
                    <div key={p.id} style={{ background: WHITE, borderRadius: 14, border: `1.5px solid ${BLACK}`, overflow: "hidden", display: "flex", flexDirection: "column" }}>
                      <div style={{ background: GRAY_SOFT, height: 80, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 32 }}>📦</div>
                      <div style={{ padding: "10px 12px", display: "flex", flexDirection: "column", gap: 8, flex: 1 }}>
                        <div style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.2, minHeight: 32 }}>{p.name}</div>
                        <div className="space-grotesk" style={{ fontWeight: 700, fontSize: 14 }}>{naira(p.price)}</div>
                        {qty === 0 ? (
                          <button onClick={() => addToCart(p.id)} style={{ marginTop: "auto", background: YELLOW, color: BLACK, border: `1.5px solid ${BLACK}`, borderRadius: 8, padding: "7px 0", fontWeight: 700, fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}>➕ Add</button>
                        ) : (
                          <div style={{ marginTop: "auto", display: "flex", justifyContent: "space-between", background: BLACK, borderRadius: 8, padding: "4px 6px" }}>
                            <button onClick={() => dec(p.id)} style={{ background: "none", color: WHITE, padding: 2 }}>−</button>
                            <span style={{ color: WHITE, fontWeight: 700, fontSize: 12 }}>{qty}</span>
                            <button onClick={() => addToCart(p.id)} style={{ background: "none", color: YELLOW, padding: 2 }}>+</button>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </section>

              <footer style={{ borderTop: `2px solid ${BLACK}`, padding: "12px 20px", textAlign: "center", fontSize: 12.5, background: YELLOW_SOFT }}>
                Questions? Call or WhatsApp: <b>{BIZ_PHONE}</b>
              </footer>
            </>
          )}

          {cartOpen && stage === "shop" && (
            <div style={{ position: "fixed", inset: 0, zIndex: 30, display: "flex", justifyContent: "flex-end" }}>
              <div onClick={() => setCartOpen(false)} style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.5)" }} />
              <div style={{ position: "relative", width: "min(360px, 90vw)", background: WHITE, height: "100%", display: "flex", flexDirection: "column", animation: "slideUp 0.2s ease", borderLeft: `2px solid ${BLACK}` }}>
                <div style={{ padding: "16px 20px", borderBottom: `1.5px solid ${BLACK}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div className="space-grotesk" style={{ fontWeight: 700, fontSize: 18 }}>Your Cart</div>
                  <button onClick={() => setCartOpen(false)} style={{ background: "none", border: "none", fontSize: 20 }}>✕</button>
                </div>
                <div style={{ flex: 1, overflowY: "auto", padding: "12px 16px" }}>
                  {cartItems.length === 0 ? (
                    <div style={{ textAlign: "center", opacity: 0.6, marginTop: 50, fontSize: 13 }}>Your cart is empty.</div>
                  ) : cartItems.map(i => (
                    <div key={i.id} style={{ display: "flex", gap: 10, padding: "10px 0", borderBottom: "1px solid #ddd", alignItems: "center" }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 12.5, fontWeight: 600 }}>{i.name}</div>
                        <div style={{ fontSize: 12, opacity: 0.7 }}>{naira(i.price)} × {i.qty}</div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                        <button onClick={() => dec(i.id)} style={{ background: GRAY_SOFT, border: "none", borderRadius: 6, width: 22, height: 22 }}>−</button>
                        <span style={{ fontWeight: 700, fontSize: 12, minWidth: 12, textAlign: "center" }}>{i.qty}</span>
                        <button onClick={() => addToCart(i.id)} style={{ background: GRAY_SOFT, border: "none", borderRadius: 6, width: 22, height: 22 }}>+</button>
                      </div>
                    </div>
                  ))}
                </div>
                {cartItems.length > 0 && (
                  <div style={{ padding: 16, borderTop: `1.5px solid ${BLACK}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 6, opacity: 0.75 }}><span>Subtotal</span><span>{naira(total)}</span></div>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 10, opacity: 0.75 }}><span>Delivery</span><span>{naira(DELIVERY_FEE)}</span></div>
                    <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, fontSize: 15, marginBottom: 12 }}><span>Total</span><span>{naira(total + DELIVERY_FEE)}</span></div>
                    <button onClick={() => { setCartOpen(false); setStage("checkout"); }} style={{ width: "100%", background: BLACK, color: WHITE, border: "none", borderRadius: 10, padding: "12px 0", fontWeight: 700, fontSize: 13.5, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>Checkout →</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {stage === "checkout" && (
            <div style={{ maxWidth: 480, margin: "0 auto", padding: "24px 20px 60px", animation: "slideUp 0.25s ease" }}>
              <div style={{ fontSize: 12.5, fontWeight: 600, opacity: 0.7, marginBottom: 16 }}>Step 1 of 2: Delivery</div>
              <h2 className="space-grotesk" style={{ fontSize: 22, margin: "0 0 12px" }}>Delivery Information</h2>
              <p style={{ fontSize: 13, opacity: 0.7, margin: "0 0 18px" }}>Provide details so we know where to deliver.</p>
              <div style={{ marginBottom: 12 }}>
                <label style={{ fontSize: 12, fontWeight: 600, opacity: 0.75, display: "block", marginBottom: 4 }}>Full Name</label>
                <input type="text" placeholder="John Adeyemi" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} style={{ width: "100%", padding: "9px 11px", border: `1.5px solid ${BLACK}`, borderRadius: 10, fontSize: 13 }} />
              </div>
              <div style={{ marginBottom: 12 }}>
                <label style={{ fontSize: 12, fontWeight: 600, opacity: 0.75, display: "block", marginBottom: 4 }}>Phone Number</label>
                <input type="text" placeholder="08012345678" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} style={{ width: "100%", padding: "9px 11px", border: `1.5px solid ${BLACK}`, borderRadius: 10, fontSize: 13 }} />
              </div>
              <div style={{ marginBottom: 12 }}>
                <label style={{ fontSize: 12, fontWeight: 600, opacity: 0.75, display: "block", marginBottom: 4 }}>Address</label>
                <textarea placeholder="Street, area, city" value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} rows={2} style={{ width: "100%", padding: "9px 11px", border: `1.5px solid ${BLACK}`, borderRadius: 10, fontSize: 13, resize: "none" }} />
              </div>
              <div style={{ background: GRAY_SOFT, borderRadius: 12, padding: 14, marginBottom: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 5 }}><span>Items</span><span>{naira(total)}</span></div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 8, opacity: 0.75 }}><span>Delivery</span><span>{naira(DELIVERY_FEE)}</span></div>
                <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, fontSize: 15, paddingTop: 8, borderTop: `1px dashed ${BLACK}` }}><span>Total</span><span>{naira(total + DELIVERY_FEE)}</span></div>
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => setStage("shop")} style={{ flex: 1, background: WHITE, border: `1.5px solid ${BLACK}`, borderRadius: 10, padding: "11px 0", fontWeight: 600, fontSize: 13 }}>Back</button>
                <button disabled={!canCheckout} onClick={() => setStage("payment")} style={{ flex: 2, background: canCheckout ? BLACK : "#ccc", color: WHITE, border: "none", borderRadius: 10, padding: "11px 0", fontWeight: 700, fontSize: 13 }}>Continue to Payment</button>
              </div>
            </div>
          )}

          {stage === "payment" && (
            <div style={{ maxWidth: 480, margin: "0 auto", padding: "24px 20px 60px", animation: "slideUp 0.25s ease" }}>
              <div style={{ fontSize: 12.5, fontWeight: 600, opacity: 0.7, marginBottom: 16 }}>Step 2 of 2: Payment</div>
              <h2 className="space-grotesk" style={{ fontSize: 22, margin: "0 0 12px" }}>Bank Transfer</h2>
              <p style={{ fontSize: 13, opacity: 0.7, margin: "0 0 16px" }}>Transfer <b>{naira(total + DELIVERY_FEE)}</b> to the account below.</p>
              <div style={{ background: BLACK, color: WHITE, borderRadius: 14, padding: 16, marginBottom: 14 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                  <div style={{ width: 32, height: 32, borderRadius: 8, background: YELLOW, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700 }}>🏦</div>
                  <span style={{ fontWeight: 700, fontSize: 14 }}>Account Details</span>
                </div>
                <div style={{ marginBottom: 10 }}>
                  <div style={{ fontSize: 10.5, opacity: 0.65, marginBottom: 2 }}>Account Number</div>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span className="space-grotesk" style={{ fontWeight: 700, fontSize: 20 }}>{BANK.number}</span>
                    <button onClick={copyAccount} style={{ background: YELLOW, border: "none", borderRadius: 7, padding: "6px 9px", display: "flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 700, color: BLACK }}>{copied ? "✓ Copied" : "📋 Copy"}</button>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 16 }}>
                  <div><div style={{ fontSize: 10.5, opacity: 0.65, marginBottom: 2 }}>Bank</div><div style={{ fontWeight: 700, fontSize: 13 }}>{BANK.name}</div></div>
                  <div><div style={{ fontSize: 10.5, opacity: 0.65, marginBottom: 2 }}>Account Name</div><div style={{ fontWeight: 700, fontSize: 13 }}>{BANK.holder}</div></div>
                </div>
              </div>
              <div style={{ background: YELLOW_SOFT, border: `1.5px solid ${BLACK}`, borderRadius: 10, padding: "10px 12px", fontSize: 12, marginBottom: 16 }}>
                After paying, send receipt to WhatsApp <b>{BIZ_PHONE}</b> for verification.
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => setStage("checkout")} style={{ flex: 1, background: WHITE, border: `1.5px solid ${BLACK}`, borderRadius: 10, padding: "11px 0", fontWeight: 600, fontSize: 13 }}>Back</button>
                <button onClick={confirmOrder} style={{ flex: 2, background: YELLOW, color: BLACK, border: `1.5px solid ${BLACK}`, borderRadius: 10, padding: "11px 0", fontWeight: 700, fontSize: 13 }}>Confirm Payment ✓</button>
              </div>
            </div>
          )}

          {stage === "confirmed" && (
            <div style={{ maxWidth: 480, margin: "0 auto", padding: "36px 20px 60px", textAlign: "center", animation: "slideUp 0.25s ease" }}>
              <div style={{ width: 60, height: 60, borderRadius: "50%", background: YELLOW, border: `2px solid ${BLACK}`, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 14px", fontSize: 28 }}>✓</div>
              <h2 className="space-grotesk" style={{ fontSize: 20, margin: "0 0 6px" }}>Order Confirmed!</h2>
              <p style={{ fontSize: 12.5, opacity: 0.7, margin: "0 0 3px" }}>Order #{orderId}</p>
              <p style={{ fontSize: 12.5, opacity: 0.7, margin: "0 0 20px" }}>Delivering to: <b>{form.address}</b></p>
              <div style={{ background: WHITE, border: `1.5px solid ${BLACK}`, borderRadius: 12, padding: 16, textAlign: "left" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}><span style={{ fontSize: 18 }}>✓</span><span style={{ fontSize: 13, fontWeight: 600 }}>Order Received</span></div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, opacity: 0.6 }}><span style={{ fontSize: 18 }}>💳</span><span style={{ fontSize: 13, fontWeight: 600 }}>Verifying Payment</span></div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, opacity: 0.6 }}><span style={{ fontSize: 18 }}>📦</span><span style={{ fontSize: 13, fontWeight: 600 }}>Preparing Items</span></div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, opacity: 0.6 }}><span style={{ fontSize: 18 }}>🚚</span><span style={{ fontSize: 13, fontWeight: 600 }}>In Transit</span></div>
              </div>
              <button onClick={() => { setStage("shop"); setCart({}); setForm({ name: "", phone: "", address: "" }); }} style={{ marginTop: 20, background: BLACK, color: WHITE, border: "none", borderRadius: 10, padding: "11px 24px", fontWeight: 700, fontSize: 13 }}>Continue Shopping</button>
            </div>
          )}
        </div>
      );
    }

    // ADMIN DASHBOARD
    function AdminDashboard({ products, setProducts, orders, setOrders, onLogout }) {
      const [tab, setTab] = useState("dashboard");
      const [editProduct, setEditProduct] = useState(null);
      const [newProduct, setNewProduct] = useState({ name: "", price: "", cat: "Food" });

      const totalRevenue = orders.reduce((sum, o) => sum + o.total, 0);
      const pendingOrders = orders.filter(o => o.status === "Payment Pending").length;

      const handleAddProduct = () => {
        if (!newProduct.name || !newProduct.price) return;
        const product = { id: Math.max(...products.map(p => p.id), 0) + 1, name: newProduct.name, price: parseInt(newProduct.price), cat: newProduct.cat };
        const updated = [...products, product];
        setProducts(updated);
        DB.setProducts(updated);
        setNewProduct({ name: "", price: "", cat: "Food" });
      };

      const handleSaveProduct = () => {
        if (!editProduct.name || !editProduct.price) return;
        const updated = products.map(p => p.id === editProduct.id ? editProduct : p);
        setProducts(updated);
        DB.setProducts(updated);
        setEditProduct(null);
      };

      const handleDeleteProduct = (id) => {
        const updated = products.filter(p => p.id !== id);
        setProducts(updated);
        DB.setProducts(updated);
      };

      const handleUpdateOrderStatus = (orderId, newStatus) => {
        const updated = orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o);
        setOrders(updated);
        DB.setOrders(updated);
      };

      const handleDeleteOrder = (orderId) => {
        const updated = orders.filter(o => o.id !== orderId);
        setOrders(updated);
        DB.setOrders(updated);
      };

      return (
        <div style={{ background: WHITE, minHeight: "100vh", color: BLACK }}>
          <header style={{ background: BLACK, color: WHITE, padding: "16px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `2px solid ${YELLOW}` }}>
            <div className="space-grotesk" style={{ fontWeight: 700, fontSize: 18 }}><span style={{ color: YELLOW }}>e24</span>Market Admin</div>
            <button onClick={onLogout} style={{ background: YELLOW, color: BLACK, border: "none", borderRadius: 8, padding: "8px 14px", fontWeight: 700, fontSize: 12 }}>🚪 Logout</button>
          </header>

          <div style={{ display: "flex", borderTop: `1px solid #ddd` }}>
            <div style={{ width: 180, background: GRAY_SOFT, borderRight: `1px solid #ddd`, padding: "16px 0" }}>
              <button onClick={() => setTab("dashboard")} style={{ width: "100%", background: tab === "dashboard" ? YELLOW : "transparent", border: "none", padding: "12px 16px", textAlign: "left", fontWeight: 600, fontSize: 14, cursor: "pointer" }}>📊 Dashboard</button>
              <button onClick={() => setTab("orders")} style={{ width: "100%", background: tab === "orders" ? YELLOW : "transparent", border: "none", padding: "12px 16px", textAlign: "left", fontWeight: 600, fontSize: 14, cursor: "pointer" }}>🛒 Orders ({orders.length})</button>
              <button onClick={() => setTab("products")} style={{ width: "100%", background: tab === "products" ? YELLOW : "transparent", border: "none", padding: "12px 16px", textAlign: "left", fontWeight: 600, fontSize: 14, cursor: "pointer" }}>📦 Products ({products.length})</button>
            </div>

            <div style={{ flex: 1, padding: "24px" }}>
              {tab === "dashboard" && (
                <div>
                  <h2 className="space-grotesk" style={{ fontSize: 24, margin: "0 0 24px" }}>Dashboard</h2>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 16 }}>
                    <div style={{ background: YELLOW, borderRadius: 12, padding: 16, border: `2px solid ${BLACK}` }}>
                      <div style={{ opacity: 0.75, fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Total Revenue</div>
                      <div className="space-grotesk" style={{ fontWeight: 700, fontSize: 24 }}>{naira(totalRevenue)}</div>
                    </div>
                    <div style={{ background: GRAY_SOFT, borderRadius: 12, padding: 16, border: `2px solid ${BLACK}` }}>
                      <div style={{ opacity: 0.75, fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Pending Orders</div>
                      <div className="space-grotesk" style={{ fontWeight: 700, fontSize: 24 }}>{pendingOrders}</div>
                    </div>
                    <div style={{ background: GRAY_SOFT, borderRadius: 12, padding: 16, border: `2px solid ${BLACK}` }}>
                      <div style={{ opacity: 0.75, fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Total Orders</div>
                      <div className="space-grotesk" style={{ fontWeight: 700, fontSize: 24 }}>{orders.length}</div>
                    </div>
                  </div>
                </div>
              )}

              {tab === "orders" && (
                <div>
                  <h2 className="space-grotesk" style={{ fontSize: 24, margin: "0 0 20px" }}>Orders</h2>
                  {orders.length === 0 ? (
                    <div style={{ textAlign: "center", opacity: 0.6, fontSize: 14, paddingTop: 40 }}>No orders yet.</div>
                  ) : (
                    <div style={{ overflowX: "auto" }}>
                      <table style={{ width: "100%", borderCollapse: "collapse" }}>
                        <thead>
                          <tr style={{ background: GRAY_SOFT, borderBottom: `2px solid ${BLACK}` }}>
                            <th style={{ padding: 12, textAlign: "left", fontWeight: 700, fontSize: 12 }}>Order ID</th>
                            <th style={{ padding: 12, textAlign: "left", fontWeight: 700, fontSize: 12 }}>Customer</th>
                            <th style={{ padding: 12, textAlign: "left", fontWeight: 700, fontSize: 12 }}>Phone</th>
                            <th style={{ padding: 12, textAlign: "left", fontWeight: 700, fontSize: 12 }}>Amount</th>
                            <th style={{ padding: 12, textAlign: "left", fontWeight: 700, fontSize: 12 }}>Status</th>
                            <th style={{ padding: 12, textAlign: "left", fontWeight: 700, fontSize: 12 }}>Actions</th>
                          </tr>
                        </thead>
                        <tbody>
                          {orders.map(o => (
                            <tr key={o.id} style={{ borderBottom: "1px solid #ddd" }}>
                              <td style={{ padding: 12, fontSize: 12, fontFamily: "'Space Grotesk'", fontWeight: 600 }}>{o.id}</td>
                              <td style={{ padding: 12, fontSize: 12 }}>{o.customer.name}</td>
                              <td style={{ padding: 12, fontSize: 12 }}>{o.customer.phone}</td>
                              <td style={{ padding: 12, fontSize: 12, fontWeight: 700 }}>{naira(o.total)}</td>
                              <td style={{ padding: 12, fontSize: 12 }}>
                                <select value={o.status} onChange={(e) => handleUpdateOrderStatus(o.id, e.target.value)} style={{ padding: "5px 8px", borderRadius: 6, border: `1px solid ${BLACK}`, fontSize: 11, fontWeight: 600 }}>
                                  <option>Payment Pending</option>
                                  <option>Payment Verified</option>
                                  <option>Preparing</option>
                                  <option>In Transit</option>
                                  <option>Delivered</option>
                                </select>
                              </td>
                              <td style={{ padding: 12 }}>
                                <button onClick={() => handleDeleteOrder(o.id)} style={{ background: "#ff4444", color: WHITE, border: "none", borderRadius: 6, padding: "5px 10px", fontSize: 11, fontWeight: 600 }}>Delete</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}

              {tab === "products" && (
                <div>
                  <h2 className="space-grotesk" style={{ fontSize: 24, margin: "0 0 20px" }}>Products</h2>
                  <div style={{ background: YELLOW_SOFT, border: `2px solid ${BLACK}`, borderRadius: 12, padding: 16, marginBottom: 24 }}>
                    <h3 style={{ margin: "0 0 12px", fontWeight: 700 }}>Add New Product</h3>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                      <input type="text" placeholder="Product Name" value={newProduct.name} onChange={(e) => setNewProduct({ ...newProduct, name: e.target.value })} style={{ padding: "10px", border: `1px solid ${BLACK}`, borderRadius: 8 }} />
                      <input type="number" placeholder="Price" value={newProduct.price} onChange={(e) => setNewProduct({ ...newProduct, price: e.target.value })} style={{ padding: "10px", border: `1px solid ${BLACK}`, borderRadius: 8 }} />
                      <select value={newProduct.cat} onChange={(e) => setNewProduct({ ...newProduct, cat: e.target.value })} style={{ padding: "10px", border: `1px solid ${BLACK}`, borderRadius: 8 }}>
                        <option>Food</option>
                        <option>Clothes</option>
                        <option>Electronics</option>
                        <option>Kitchenware</option>
                      </select>
                    </div>
                    <button onClick={handleAddProduct} style={{ background: BLACK, color: WHITE, border: "none", borderRadius: 8, padding: "10px 16px", fontWeight: 700 }}>+ Add Product</button>
                  </div>

                  {editProduct && (
                    <div style={{ background: GRAY_SOFT, border: `2px solid ${BLACK}`, borderRadius: 12, padding: 16, marginBottom: 24 }}>
                      <h3 style={{ margin: "0 0 12px", fontWeight: 700 }}>Edit Product</h3>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                        <input type="text" value={editProduct.name} onChange={(e) => setEditProduct({ ...editProduct, name: e.target.value })} style={{ padding: "10px", border: `1px solid ${BLACK}`, borderRadius: 8 }} />
                        <input type="number" value={editProduct.price} onChange={(e) => setEditProduct({ ...editProduct, price: parseInt(e.target.value) })} style={{ padding: "10px", border: `1px solid ${BLACK}`, borderRadius: 8 }} />
                      </div>
                      <div style={{ display: "flex", gap: 10 }}>
                        <button onClick={handleSaveProduct} style={{ background: YELLOW, color: BLACK, border: `1px solid ${BLACK}`, borderRadius: 8, padding: "9px 14px", fontWeight: 700 }}>Save</button>
                        <button onClick={() => setEditProduct(null)} style={{ background: WHITE, color: BLACK, border: `1px solid ${BLACK}`, borderRadius: 8, padding: "9px 14px", fontWeight: 700 }}>Cancel</button>
                      </div>
                    </div>
                  )}

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 16 }}>
                    {products.map(p => (
                      <div key={p.id} style={{ background: WHITE, border: `1.5px solid ${BLACK}`, borderRadius: 12, padding: 14 }}>
                        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 6 }}>{p.name}</div>
                        <div className="space-grotesk" style={{ fontWeight: 700, fontSize: 16, marginBottom: 8 }}>{naira(p.price)}</div>
                        <div style={{ fontSize: 12, opacity: 0.75, marginBottom: 12 }}>{p.cat}</div>
                        <div style={{ display: "flex", gap: 8 }}>
                          <button onClick={() => setEditProduct(p)} style={{ flex: 1, background: YELLOW, color: BLACK, border: "none", borderRadius: 8, padding: "7px 0", fontWeight: 700, fontSize: 12 }}>Edit</button>
                          <button onClick={() => handleDeleteProduct(p.id)} style={{ flex: 1, background: "#ff4444", color: WHITE, border: "none", borderRadius: 8, padding: "7px 0", fontWeight: 700, fontSize: 12 }}>Delete</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<E24Market />, document.getElementById("root"));
  </script>
</body>
</html>
